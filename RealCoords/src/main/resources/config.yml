# RealCoords：基岩版玩家的「浮動原點」與真實座標顯示
# 修改後需重啟 Geyser（或重新載入擴充）。

origin-shift:
  enabled: true
  # java：在 Geyser 轉成 float 前轉換；bedrock：舊版相容模式
  layer: java
  # Java 模式連續移動／飛行時是否自動重設浮動原點；需啟用區塊快取且附近有快取，預設關閉
  shift-while-moving: false
  # 偏移量的對齊單位，必須是 16 的倍數（會自動修正）
  alignment: 256
  # 登入／重生／維度切換／遠距傳送時，若局部座標超過此值就重新置中（這些事件本來就會重載世界）
  recenter-on-reload: 2048
  # 連續移動模式的精度觸發門檻；預設 100000 格。數值過大會降低 float 座標精度
  trigger-distance: 100000
  # 真實座標回到此範圍內時歸零；必須小於 trigger-distance（載入時會檢查並警告／調整）
  reset-distance: 50000
  # 舊模式冷卻時間；單位為 tick
  cooldown-ticks: 100
  # 舊模式換原點／伺服器傳送後，等待客戶端到位的最長時間
  ack-timeout-ticks: 60
  ack-tolerance: 4.0
  # Phase 2 transition 整體逾時上限，單位為 tick
  transition-timeout-ticks: 100
  # 兩次 transition 之間的最短間隔，單位為 tick
  transition-cooldown-ticks: 600
  # transition 結束後使用 transition-grace-max-jump 有上限放寬的寬限期，單位為 tick
  transition-grace-ticks: 20
  # 延後 transition 超過 trigger-distance 的 8 倍時：none（不處理）、kick（踢出）、reorigin（嘗試重新置中）
  walk-fallback: none
  # 每個維度可單獨覆寫 enabled / trigger-distance / reset-distance / alignment
  dimensions:
    overworld: { enabled: true }
    the_nether: { enabled: true }
    the_end: { enabled: true }

safety:
  max-serverbound-jump: 64.0
  # Transition / grace movement limit; must be >= max-serverbound-jump
  transition-grace-max-jump: 256.0
  correction-interval-ticks: 10
  debug-log: false

chunk-cache:
  enabled: true
  compress: true
  max-chunks: 2500
  max-bytes: 33554432
  activate-margin: 1500
  resend-per-tick: 24
  evict-margin-chunks: 4

nbt-shift-keys:
  x: [x, pistonPosX]
  z: [z, pistonPosZ]
  triples: [AttachedBlocks, BreakBlocks]

actionbar:
  enabled: true
  hide-vanilla-coordinates: true
  interval-ticks: 10
  format: "&fX &e{x}  &fY &e{y}  &fZ &e{z}  &7{facing}"
  number-format: "%,.1f"
  merge-java-actionbar: true
  java-actionbar-keep-ms: 3000
  separator: " &8| &r"
  eye-height: 1.62
  facing: ["南 +Z", "西 -X", "北 -Z", "東 +X"]
