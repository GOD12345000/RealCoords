name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (use v2.0.0 for this release)"
        required: true
        default: "v2.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify project layout
        run: |
          test -f RealCoords/build.gradle.kts
          test -f RealCoords/gradle.properties
          test -f RealCoords/src/main/resources/extension.yml
          test -d RealCoords/src/main/java

      - name: Verify release version matches requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          test "$(grep '^version = ' RealCoords/build.gradle.kts | head -n1 | cut -d '"' -f2)" = "$RELEASE_VERSION"
          test "$(grep '^version:' RealCoords/src/main/resources/extension.yml | awk '{print $2}')" = "$RELEASE_VERSION"

      - name: Build release JAR
        working-directory: RealCoords
        run: gradle --no-daemon clean build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: RealCoords ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: RELEASE_NOTES_2.0.0.md
          files: RealCoords/build/libs/*.jar
          fail_on_unmatched_files: true
