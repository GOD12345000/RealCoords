name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (for the first release, use v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify project layout
        run: |
          test -f RealCoords/build.gradle.kts
          test -f RealCoords/gradle.properties
          test -f RealCoords/src/main/resources/extension.yml
          test -d RealCoords/src/main/java

      - name: Build release JAR
        working-directory: RealCoords
        run: gradle --no-daemon clean build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: RealCoords ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## RealCoords ${{ inputs.tag_name }}

            Experimental Geyser extension implementing a per-player floating origin for Bedrock-side coordinates.

            ### Included
            - RealCoords extension JAR built from this release commit.
            - Source code and build configuration are available in this repository.

            ### Compatibility
            - Build target: Geyser 2.12.1-SNAPSHOT
            - Java bytecode target: Java 21
            - Tested loading environment: Velocity with Geyser 2.12.1.

            ### Important status
            The extension has been confirmed to compile and load in the stated environment. Full gameplay correctness has **not** yet been verified. Chunk transitions, block interactions, entities, vehicles, portals, maps, redstone and multiplayer behavior still require testing.

            Please test in a backed-up test world before using it on a production server. See the repository README for installation instructions, configuration reference, known limitations and the test checklist.
          files: RealCoords/build/libs/*.jar
          fail_on_unmatched_files: true
