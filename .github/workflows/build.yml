name: Build RealCoords

on:
  push:
    branches: [main, feature/coordinate-origin-rebasing]
    paths:
      - "RealCoords/**"
      - "RealCoordsAgent/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "RealCoords/**"
      - "RealCoordsAgent/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RealCoords
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify project layout
        run: |
          test -f RealCoords/build.gradle.kts
          test -f RealCoords/gradle.properties
          test -f RealCoordsAgent/build.gradle.kts
          test -f RealCoordsAgent/src/main/java/dev/realcoords/agent/RealCoordsAgent.java
          test -f RealCoords/src/main/resources/extension.yml

      - name: Build startup agent
        run: gradle --no-daemon -p RealCoordsAgent clean build

      - name: Build and test extension against official Geyser API
        run: gradle --no-daemon -p RealCoords clean build

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RealCoords-runtime
          path: |
            RealCoords/build/libs/*.jar
            RealCoordsAgent/build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 14
