name: Build RealCoords

on:
  push:
    branches: [main]
    paths:
      - "RealCoords-source.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and patch source
        run: |
          test -f RealCoords-source.zip
          unzip -q RealCoords-source.zip -d .
          test -f RealCoords/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path

          # Point Gradle at the current OpenCollab Maven repository.
          build = Path("RealCoords/build.gradle.kts")
          s = build.read_text()
          start = s.index("repositories {")
          end = s.index("\n}\n\ndependencies", start)
          s = s[:start] + """repositories {
              mavenCentral()
              maven("https://repo.opencollab.dev/main/")
          }""" + s[end + 2:]
          build.write_text(s)

          # Adapt the source to the Cloudburst Protocol API bundled by Geyser 2.12.1.
          source = Path("RealCoords/src/main/java/dev/realcoords/ShiftSession.java")
          s = source.read_text()
          s = s.replace(
              "import org.cloudburstmc.protocol.bedrock.data.inventory.transaction.InventoryTransactionType;",
              "import org.cloudburstmc.protocol.bedrock.data.inventory.transaction.InventoryTransactionType;\\n"
              "import org.cloudburstmc.protocol.bedrock.data.inventory.transaction.ItemUseTransaction;"
          )
          s = s.replace("EntityDataTypes.PLAYER_BED_POSITION", "EntityDataTypes.BED_POSITION")
          s = s.replace("EntityDataTypes.BLOCK_TARGET", "EntityDataTypes.BLOCK_TARGET_POS")

          old = """    private void invTx(InventoryTransactionPacket t) {
          if (t == null) return;
          if (t.getPlayerPosition() != null) t.setPlayerPosition(toR(t.getPlayerPosition()));
          if (t.getTransactionType() == InventoryTransactionType.ITEM_USE && t.getBlockPosition() != null) {
              t.setBlockPosition(toR(t.getBlockPosition()));
          }
          }
          """
          new = """    private void invTx(InventoryTransactionPacket t) {
          if (t == null) return;
          if (t.getPlayerPosition() != null) t.setPlayerPosition(toR(t.getPlayerPosition()));
          if (t.getTransactionType() == InventoryTransactionType.ITEM_USE && t.getBlockPosition() != null) {
              t.setBlockPosition(toR(t.getBlockPosition()));
          }
          }

          private void invTx(ItemUseTransaction t) {
          if (t == null) return;
          if (t.getPlayerPosition() != null) t.setPlayerPosition(toR(t.getPlayerPosition()));
          // 0 = place/click block, 1 = use/click air, 2 = destroy, 3 = attack.
          if (t.getActionType() != 1 && t.getActionType() != 3 && t.getBlockPosition() != null) {
              t.setBlockPosition(toR(t.getBlockPosition()));
          }
          }
          """
          if "private void invTx(ItemUseTransaction t)" not in s:
              # Match the exact method body while preserving its indentation.
              marker = "    private void invTx(InventoryTransactionPacket t) {"
              i = s.index(marker)
              j = s.index("\n    private void onAuthInput", i)
              block = s[i:j]
              s = s[:j] + "\n" + new.replace("\\n", "\n").replace("\n          ", "\n    ").replace("\n          ", "\n    ") + s[j:]
          old_actions = """                    it.set(new PlayerBlockActionData(x.getAction(), toR(x.getBlockPosition()), x.getFace()));"""
          if old_actions in s:
              s = s.replace(old_actions, "                    x.setBlockPosition(toR(x.getBlockPosition()));")
          if "EntityDataTypes.PLAYER_BED_POSITION" in s or "EntityDataTypes.BLOCK_TARGET)" in s:
              raise SystemExit("Entity metadata API replacement did not apply")
          if "new PlayerBlockActionData(" in s:
              raise SystemExit("PlayerBlockActionData constructor replacement did not apply")
          source.write_text(s)
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        working-directory: RealCoords
        run: gradle --no-daemon -PgeyserVersion=2.12.1-SNAPSHOT -PjavaVersion=21 clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealCoords-JAR
          path: RealCoords/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
