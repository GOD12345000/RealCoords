name: Build RealCoords

on:
  push:
    branches: [main]
    paths:
      - "RealCoords-source.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and patch source
        run: |
          test -f RealCoords-source.zip
          unzip -q RealCoords-source.zip -d .
          test -f RealCoords/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path

          # Use the current OpenCollab Maven repository for Geyser dependencies.
          build = Path("RealCoords/build.gradle.kts")
          text = build.read_text()
          start = text.index("repositories {")
          end = text.index("\n}\n\ndependencies", start)
          text = text[:start] + """repositories {
              mavenCentral()
              maven("https://repo.opencollab.dev/main/")
          }""" + text[end + 2:]
          build.write_text(text)

          # Update the source to the Cloudburst Protocol API used by Geyser 2.12.1.
          source = Path("RealCoords/src/main/java/dev/realcoords/ShiftSession.java")
          text = source.read_text()
          old_import = "import org.cloudburstmc.protocol.bedrock.data.inventory.transaction.InventoryTransactionType;"
          new_import = old_import + chr(10) + "import org.cloudburstmc.protocol.bedrock.data.inventory.transaction.ItemUseTransaction;"
          if "import org.cloudburstmc.protocol.bedrock.data.inventory.transaction.ItemUseTransaction;" not in text:
              if old_import not in text:
                  raise SystemExit("Could not find InventoryTransactionType import")
              text = text.replace(old_import, new_import)

          text = text.replace("EntityDataTypes.PLAYER_BED_POSITION", "EntityDataTypes.BED_POSITION")
          text = text.replace("EntityDataTypes.BLOCK_TARGET", "EntityDataTypes.BLOCK_TARGET_POS")

          method_marker = "    private void onAuthInput(PlayerAuthInputPacket a) {"
          if "private void invTx(ItemUseTransaction t)" not in text:
              method = """
              private void invTx(ItemUseTransaction t) {
                  if (t == null) return;
                  if (t.getPlayerPosition() != null) t.setPlayerPosition(toR(t.getPlayerPosition()));
                  // Action type 2 is the block item-interaction transaction.
                  if (t.getActionType() == 2 && t.getBlockPosition() != null) {
                      t.setBlockPosition(toR(t.getBlockPosition()));
                  }
              }

          """
              if method_marker not in text:
                  raise SystemExit("Could not find onAuthInput insertion point")
              text = text.replace(method_marker, method + method_marker, 1)

          old_action = "it.set(new PlayerBlockActionData(x.getAction(), toR(x.getBlockPosition()), x.getFace()));"
          if old_action in text:
              text = text.replace(old_action, "x.setBlockPosition(toR(x.getBlockPosition()));")
          if "new PlayerBlockActionData(" in text:
              raise SystemExit("Unsupported PlayerBlockActionData constructor remains")
          if "EntityDataTypes.PLAYER_BED_POSITION" in text or "EntityDataTypes.BLOCK_TARGET" in text:
              raise SystemExit("Outdated EntityDataTypes reference remains")
          source.write_text(text)
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        working-directory: RealCoords
        run: gradle --no-daemon -PgeyserVersion=2.12.1-SNAPSHOT -PjavaVersion=21 clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealCoords-JAR
          path: RealCoords/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
