name: Build RealCoords

on:
  push:
    branches: [main]
    paths:
      - 'RealCoords/**'
      - 'RealCoords-source.zip'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'RealCoords/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Write permission is used only to commit the one-time source migration.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Migrate legacy source archive (if present)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -f RealCoords-source.zip ]; then
            unzip -q RealCoords-source.zip -d .
            test -f RealCoords/build.gradle.kts
            test -d RealCoords/src
            python3 .github/scripts/migrate_source.py
            rm RealCoords-source.zip
            printf 'build/\n.gradle/\n' > RealCoords/.gitignore
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'Move RealCoords source into browsable project files'
              git push
            fi
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify project layout
        run: |
          test -f RealCoords/build.gradle.kts
          test -f RealCoords/src/main/resources/extension.yml
          test -d RealCoords/src/main/java

      - name: Build
        working-directory: RealCoords
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealCoords-JAR
          path: RealCoords/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
