name: Build RealCoords

on:
  push:
    branches: ["**"]
    paths:
      - "RealCoords/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "RealCoords/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify project layout
        run: |
          test -f RealCoords/build.gradle.kts
          test -f RealCoords/gradle.properties
          test -f RealCoords/src/main/resources/extension.yml
          test -d RealCoords/src/main/java

      - name: Build
        working-directory: RealCoords
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealCoords-JAR
          path: RealCoords/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
